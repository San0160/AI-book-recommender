data_processing:
  feature_fields: [title, authors, description] 

data_transformation:
  method: tfidf              # options tfidf | embeddings

  tfidf:
    max_features: null
    ngram_range: [1, 2]
    min_df: 2
    max_df: 1.0
    sublinear_tf: true
    stop_words: english

  embeddings:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 64
    normalize: true

model_trainer:
  model_name: knn            # options: knn | svd_knn

  knn:
    n_neighbors: 6
    metric: cosine
    algorithm: brute

  svd_knn:           
    n_components: 150
    random_state: 42
    n_neighbors: 10
    metric: cosine
    algorithm: brute



