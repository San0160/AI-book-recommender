name: Uptime
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "Set the SITE_URL repository variable"; exit 1; }
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 "$SITE_URL/ready"
          curl -fsS --max-time 20 "$SITE_URL/v1/recommend?title=Dune&n=3" > /dev/null