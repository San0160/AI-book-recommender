[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E9", "F"]          # syntax errors + pyflakes (unused imports, undefined names)
ignore = ["F403", "F405"]     # star import from constant/ (clean up later)