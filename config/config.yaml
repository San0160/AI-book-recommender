# Template for dataset path

artifacts_root: artifacts

data_injection:
  root_dir: artifacts/data_injection
  source_URL: https://huggingface.co/datasets/San0160/Books_enriched/resolve/main/books_enriched.csv  
  local_data_file: artifacts/data_injection/data.csv
  unzip_dir: artifacts/data_injection

data_validation:
  root_dir: artifacts/data_validation
  STATUS_FILE: artifacts/data_validation/status.txt
  ALL_REQUIRED_FILES: ["data.csv"]


data_processing:
  root_dir: artifacts/data_preprocessing
  local_data_file: artifacts/data_preprocessing/processed_data.csv
  data_path: artifacts/data_injection/data.csv

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_preprocessing/processed_data.csv
  vectorizer_path: artifacts/data_transformation/tfidf.pkl
  feature_matrix_path: artifacts/data_transformation/feature_matrix.pkl

model_trainer:
  root_dir: artifacts/model_trainer
  data_path: artifacts/data_preprocessing/processed_data.csv
  feature_matrix_path: artifacts/data_transformation/feature_matrix.pkl
  model_path: artifacts/model_trainer/model.pkl

model_evaluation:
  root_dir: artifacts/model_evaluation
  data_path: artifacts/data_preprocessing/processed_data.csv
  model_path: artifacts/model_trainer/model.pkl
  feature_matrix_path: artifacts/data_transformation/feature_matrix.pkl
  metrics_file: artifacts/model_evaluation/metrics.json
  sample_size: 2000
  n_recommendations: 5
  mlflow_tracking_uri: sqlite:///mlflow.db
  mlflow_experiment_name: book-recommender